<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Order</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;padding:20px}
  .rainbow-bar{height:3px;background:linear-gradient(90deg,#00d2ff,#9c27b0,#ff1e50,#ffd700);border-radius:2px;margin-bottom:24px}
  h1{font-family:'Bebas Neue',cursive;font-size:30px;letter-spacing:3px;text-align:center;margin-bottom:24px}
  h1 span{color:#ff1e50}
  .section-label{color:#666;font-size:10px;letter-spacing:3px;margin-bottom:14px}
  .rows{background:#111;border-radius:16px;overflow:hidden;border:1px solid #1e1e1e;margin-bottom:20px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #1a1a1a}
  .row:last-child{border-bottom:none}
  .row-key{color:#777;font-size:14px}
  .row-val{font-size:14px;font-weight:600;color:#fff}
  .row-val.cyan{color:#00d2ff}
  .price-box{background:#111;border-radius:16px;padding:24px;text-align:center;margin-bottom:24px;border:1px solid #1e1e1e}
  .price-label{color:#666;font-size:11px;letter-spacing:3px;margin-bottom:8px}
  .price{color:#00ff88;font-size:46px;font-weight:700}
  .proceed-btn{width:100%;background:#fff;color:#000;border:none;padding:17px;border-radius:14px;font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:3px;cursor:pointer;transition:opacity 0.2s;margin-bottom:14px}
  .proceed-btn:hover{opacity:0.9}
  .cancel{text-align:center;color:#666;font-size:13px;cursor:pointer}
  .cancel:hover{color:#aaa}
</style>
</head>
<body>
<div class="rainbow-bar"></div>
<h1>CONFIRM<span>ORDER</span></h1>
<p class="section-label">INVENTORY DETAILS</p>
<div class="rows">
  <div class="row"><span class="row-key">Product</span><span class="row-val" id="prodName">—</span></div>
  <div class="row"><span class="row-key">Access Type</span><span class="row-val cyan" id="accessType">Instant Lifetime</span></div>
  <div class="row"><span class="row-key">Video Quality</span><span class="row-val" id="vidQuality">4K Ultra HD</span></div>
  <div class="row"><span class="row-key">Cloud Link</span><span class="row-val">Encrypted Private</span></div>
  <div class="row"><span class="row-key">Support</span><span class="row-val">Priority 24/7</span></div>
</div>
<div class="price-box">
  <div class="price-label">NET PAYABLE AMOUNT</div>
  <div class="price" id="price">₹199.00</div>
</div>
<button class="proceed-btn" onclick="window.location.href='payment.html'">PROCEED TO PAYMENT</button>
<p class="cancel" onclick="history.back()">← Cancel and Return</p>
<script>
try{
  const o=JSON.parse(sessionStorage.getItem('pendingOrder')||'{}');
  if(o.productName)document.getElementById('prodName').textContent=o.productName;
  if(o.accessType)document.getElementById('accessType').textContent=o.accessType;
  if(o.videoQuality)document.getElementById('vidQuality').textContent=o.videoQuality;
  if(o.price)document.getElementById('price').textContent='₹'+o.price+'.00';
}catch(e){}
</script>
</body>
</html>
