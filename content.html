<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PremiumHUB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:80px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #1a1a1a}
  .logo{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:2px}
  .logo span{color:#ff1e50}
  .live{color:#00ff88;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
  .live::before{content:'';width:7px;height:7px;background:#00ff88;border-radius:50%;animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .wallet{background:#1a1a1a;border-radius:16px;margin:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border:1px solid #222}
  .wallet-label{color:#666;font-size:11px;letter-spacing:2px;margin-bottom:4px}
  .wallet-amt{color:#00ff88;font-size:28px;font-weight:700}
  .vip{background:linear-gradient(135deg,#00d2ff,#00ff88);color:#000;padding:6px 16px;border-radius:20px;font-weight:700;font-size:13px;letter-spacing:1px}
  .big-pack{background:linear-gradient(135deg,#ffd700,#ffb300);color:#000;margin:0 14px 14px;border-radius:14px;padding:16px;text-align:center;font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 20px rgba(255,215,0,0.3)}
  .product-card{margin:0 14px 20px;border-radius:20px;overflow:hidden;background:#111;border:1px solid #222}
  .product-img{width:100%;height:220px;object-fit:cover;display:block;background:#1a1a1a;position:relative;overflow:hidden}
  .product-img-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(160deg,#1a0a14,#2d0a20)}
  .product-name{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:3px;padding:14px 16px 6px}
  .tags{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
  .tag{border:1.5px solid;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:1px}
  .tag.cyan{border-color:#00d2ff;color:#00d2ff}
  .tag.green{border-color:#00ff88;color:#00ff88}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
  .btn{padding:13px;border-radius:10px;border:none;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity 0.2s}
  .btn:hover{opacity:0.85}
  .btn-dark{background:#1e1e1e;color:#fff;border:1px solid #333}
  .btn-outline{background:transparent;color:#ffd700;border:1.5px solid #ffd700}
  .btn-half{background:transparent;color:#00ff88;border:1.5px solid #00ff88}
  .btn-full{background:linear-gradient(135deg,#ff1e50,#ff6b00);color:#fff}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #1e1e1e;display:flex;padding:10px 0;z-index:50}
  .nav-item{flex:1;text-align:center;cursor:pointer;padding:4px 0}
  .nav-item .icon{font-size:20px}
  .nav-item .label{font-size:10px;letter-spacing:1px;margin-top:2px;color:#666}
  .nav-item.active .label{color:#ff1e50}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">PREMIUM<span>HUB</span></div>
  <div class="live">LIVE</div>
</div>

<div class="wallet">
  <div><div class="wallet-label">WALLET BALANCE</div><div class="wallet-amt" id="walletAmt">₹10.00</div></div>
  <div class="vip">VIP</div>
</div>

<div class="big-pack" id="bigPack">ALL-IN-ONE BIG PACK ACCESS ₹199</div>

<!-- Products rendered here -->
<div id="productsContainer"></div>

<nav class="nav">
  <div class="nav-item active"><div class="icon">🏠</div><div class="label">HOME</div></div>
  <div class="nav-item"><div class="icon">💬</div><div class="label">REVIEWS</div></div>
  <div class="nav-item"><div class="icon">👤</div><div class="label">PROFILE</div></div>
  <div class="nav-item"><div class="icon">✈️</div><div class="label">SUPPORT</div></div>
</nav>

<script>
// Check referrer guard
// (relaxed for demo — in production check sessionStorage flag)

// Load admin config
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem('adminConfig') || '{}'); } catch(e){}

const products = cfg.products || [{
  name: "INDIAN COLLECTION",
  emoji: "🔥",
  videoCount: "5000+",
  halfPrice: 99,
  fullPrice: 199,
  tag: "4K UHD"
}];

const container = document.getElementById('productsContainer');

products.forEach((p, idx) => {
  const card = document.createElement('div');
  card.className = 'product-card';
  card.innerHTML = `
    <div class="product-img">
      <div class="product-img-inner">${p.emoji || '🔥'}</div>
    </div>
    <div class="product-name">${p.name}</div>
    <div class="tags">
      <span class="tag cyan">${p.tag || '4K UHD'}</span>
      <span class="tag green">${p.videoCount || '5000+'} VIDEOS</span>
    </div>
    <div class="btns">
      <button class="btn btn-dark" onclick="openTelegram()">WATCH DEMO</button>
      <button class="btn btn-outline" onclick="openTelegram()">VIEW PROOFS</button>
      <button class="btn btn-half" onclick="buyProduct(${idx},'half')">HALF PACK</button>
      <button class="btn btn-full" onclick="buyProduct(${idx},'full')">FULL ACCESS</button>
    </div>`;
  container.appendChild(card);
});

// Update big pack price
if(cfg.bigPackPrice) document.getElementById('bigPack').textContent = `ALL-IN-ONE BIG PACK ACCESS ₹${cfg.bigPackPrice}`;

function openTelegram() { window.open('https://t.me/SEX_VIDOBOT', '_blank'); }

function buyProduct(idx, type) {
  const p = products[idx];
  const price = type === 'half' ? (p.halfPrice || 99) : (p.fullPrice || 199);
  const order = { productName: p.name, accessType: type === 'half' ? 'Half Pack' : 'Instant Lifetime', price, videoQuality: p.tag || '4K Ultra HD', videoCount: p.videoCount || '5000+' };
  sessionStorage.setItem('pendingOrder', JSON.stringify(order));
  window.location.href = 'confirm.html';
}
</script>
</body>
</html>
